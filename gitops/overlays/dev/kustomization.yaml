apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lowcode-dev
resources:
- ../../base
images:
  name: localhost:5001/lowcode-platform
  newName: localhost:5001/lowcode-platform
  newTag: sha-badimage-drill
patches:
- patch: |-
    - op: replace
      path: /data/APP_ENV
      value: dev
  target:
    kind: ConfigMap
    name: lowcode-web-config
